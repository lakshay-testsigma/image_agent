[project]
name = "product-studio"
version = "0.1.0"
description = "Agent-driven product research, fact-checking and AI product photography — one product at a time. No API keys: the harness does the model work."
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.3",
    "pypdf>=4.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"
